                                                      Entitlement.Id = ThisItem.ID
                                                  )
                                              },
                                              If(
                                                  !IsBlank(existingAssignment),
                                                  Patch(
                                                      BLC_RoleEntitlements,
                                                      existingAssignment,
                                                      {
                                                          RequiredForLeaver: false
                                                      }
                                                  )
                                              )
                                          );

                                          Refresh(BLC_RoleEntitlements);

                                          ClearCollect(
                                              colRoleEntitlements,
                                              Filter(
                                                  BLC_RoleEntitlements,
                                                  RoleProfile.Id = varSelectedRole.ID
                                              )
                                          );

                                      )
                                    Text: ="Austritt"
                                    Width: =110
                                    X: =763
                                    Y: =2
                              - lblEntitlementMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Description
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =lblEntitlementTitle.Width
                                    X: =45
                                    Y: =55
                              - lblEntitlementTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =Color.Black
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    OnSelect: |-
                                      =Set(
                                          varSelectedEntitlement,
                                          ThisItem
                                      )
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Title
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 110
                                    X: =45
                                    Y: =20
                              - tglEntitlementAssigned:
                                  Control: Classic/Toggle@2.1.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: |
                                      =
                                      !IsBlank(
                                          LookUp(
                                              colRoleEntitlements,
                                              Entitlement.Id = ThisItem.ID && Active
                                          )
                                      )
                                    DisplayMode: |
                                      =
                                      If(
                                          IsBlank(varSelectedRole),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    FalseText: ="No"
                                    Font: =Font.'Open Sans'
                                    Height: =40
                                    OnCheck: |-
                                      =If(
                                          IsBlank(varSelectedRole),
                                          Notify("Please select a role first.", NotificationType.Warning),

                                          With(
                                              {
                                                  existingAssignment: LookUp(
                                                      BLC_RoleEntitlements,
                                                      RoleProfile.Id = varSelectedRole.ID &&
                                                      Entitlement.Id = ThisItem.ID
                                                  )
                                              },
                                              If(
                                                  IsBlank(existingAssignment),

                                                  Patch(
                                                      BLC_RoleEntitlements,
                                                      Defaults(BLC_RoleEntitlements),
                                                      {
                                                          Title: varSelectedRole.Title & " - " & ThisItem.Title,

                                                          RoleProfile: {
                                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                                              Id: varSelectedRole.ID,
                                                              Value: varSelectedRole.Title
                                                          },

                                                          Entitlement: {
                                                              '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedReference",
                                                              Id: ThisItem.ID,
                                                              Value: ThisItem.Title
                                                          },

                                                          Active: true,
                                                          RequiredForJoiner: true,
                                                          RequiredForMover: false,
                                                          RequiredForLeaver: false,
                                                          IsMandatory: true,
                                                          CanBeDeselected: true
                                                      }
                                                  ),

                                                  Patch(
                                                      BLC_RoleEntitlements,
                                                      existingAssignment,
                                                      {
                                                          Active: true,
                                                          RequiredForJoiner: true
                                                      }
                                                  )
                                              )
                                          );

                                          ClearCollect(
                                              colRoleEntitlements,
                                              Filter(
                                                  BLC_RoleEntitlements,
                                                  RoleProfile.Id = varSelectedRole.ID
                                              )
                                          );

                                      )
                                    OnUncheck: |-
                                      =If(
                                          IsBlank(varSelectedRole),
                                          Notify("Please select a role first.", NotificationType.Warning),

                                          With(
                                              {
                                                  existingAssignment: LookUp(
                                                      BLC_RoleEntitlements,
                                                      RoleProfile.Id = varSelectedRole.ID &&
                                                      Entitlement.Id = ThisItem.ID
                                                  )
                                              },
                                              If(
                                                  !IsBlank(existingAssignment),
                                                  Patch(
                                                      BLC_RoleEntitlements,
                                                      existingAssignment,
                                                      {
                                                          Active: false
                                                      }
                                                  )
                                              )
                                          );

                                          ClearCollect(
                                              colRoleEntitlements,
                                              Filter(
                                                  BLC_RoleEntitlements,
                                                  RoleProfile.Id = varSelectedRole.ID
                                              )
                                          );

                                      )
                                    TrueFill: =RGBA(56, 96, 178, 1)
                                    TrueText: ="Yes"
                                    Width: =40
                                    Y: =25
