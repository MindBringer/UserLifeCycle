                                            If(
                                                ThisItem.ID = galTasks.Selected.ID,
                                                RGBA(0,120,212,1),
                                                RGBA(120,120,120,1)
                                            )
                                          Height: =24
                                          Icon: =Icon.ChevronRight
                                          OnSelect: =
                                          Width: =24
                                          X: =Parent.TemplateWidth - Self.Width - 10
                                          Y: =(Parent.TemplateHeight - Self.Height) / 2
                                    - lblTaskTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Color: =RGBA(40,40,40,1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          OnSelect: =Select(Parent)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =ThisItem.TaskTitle
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.TemplateWidth - 32
                                          Wrap: =false
                                          X: =16
                                          Y: =6
                                    - lblTaskMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                          Height: =Self.Size * 1.8
                                          OnSelect: =Select(Parent)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            =Switch(
                                                ThisItem.TaskStatus.Value,
                                                "Open", "offen",
                                                "InProgress", "in Arbeit",
                                                "Waiting", "wartet",
                                                "WaitingForInput", "wartet auf Eingabe",
                                                "Completed", "abgeschlossen",
                                                "Cancelled", "abgebrochen",
                                                "Skipped", "übersprungen",
                                                ThisItem.TaskStatus.Value
                                            )
                                            &
                                            " | "
                                            &
                                            Coalesce(
                                                ThisItem.TaskOwnerGroup.Value,
                                                "ohne Zuständigkeit"
                                            )
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =lblTaskTitle.Width
                                          X: =lblTaskTitle.X
                                          Y: =lblTaskTitle.Y + lblTaskTitle.Height
                                    - rectTaskStatus:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          BorderColor: =RGBA(0, 18, 107, 1)
                                          Fill: |+
                                            =
                                            Switch(
                                                ThisItem.TaskStatus.Value,
                                                "Open", RGBA(255,140,0,1),
                                                "InProgress", RGBA(0,120,212,1),
                                                "Waiting", RGBA(128,90,213,1),
                                                "WaitingForInput", RGBA(196,43,28,1),
                                                "Completed", RGBA(16,124,16,1),
                                                "Cancelled", RGBA(120,120,120,1),
                                                "Skipped", RGBA(120,120,120,1),
                                                RGBA(200,200,200,1)
                                            )

                                          Height: =Parent.TemplateHeight
                                          OnSelect: =Select(Parent)
                                          Width: =5
