                                    Width: =Parent.Width-220
            - rowMasterActions:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMaxHeight: =60
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - btnSaveMasterData:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |-
                          =Switch(
                              varMasterDataMode,

                              "RoleProfile",
                                  If(
                                      IsBlank(Trim(txtRoleTitle.Text)),
                                      DisplayMode.Disabled,
                                      DisplayMode.Edit
                                  ),

                              "Entitlement",
                                  If(
                                      IsBlank(Trim(txtEntitlementTitle.Text)) ||
                                      IsBlank(Trim(txtEntitlementSystem.Text)) ||
                                      IsBlank(drpEntitlementCategory.Selected),
                                      DisplayMode.Disabled,
                                      DisplayMode.Edit
                                  ),

                              DisplayMode.Disabled
                          )
                        Fill: |
                          =
                          If(
                              varMasterDataMode = "RoleProfile",
                              RGBA(0,120,212,1),
                              RGBA(255,140,0,1)
                          )
                        Font: =Font.'Open Sans'
                        Height: =42
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Switch(
                              varMasterDataMode,

                              "RoleProfile",
                                  Set(
                                      varSavedRoleProfile,
                                      Patch(
                                          BLC_RoleProfiles,
                                          If(
                                              varEditMode = "Edit",
                                              varSelectedRole,
                                              Defaults(BLC_RoleProfiles)
                                          ),
                                          {
                                              Title: Trim(txtRoleTitle.Text),

                                              'Role Name': Trim(txtRoleTitle.Text),

                                              Description: If(
                                                  IsBlank(Trim(txtRoleDescription.Text)),
                                                  Blank(),
                                                  Trim(txtRoleDescription.Text)
                                              ),

                                              Department: If(
                                                  IsBlank(Trim(txtRoleDepartment.Text)),
                                                  Blank(),
                                                  Trim(txtRoleDepartment.Text)
                                              ),

                                              Active: tglRoleActive.Value
                                          }
                                      )
                                  );

                                  If(
                                      varEditMode = "New" ||
                                      IsBlank(varSavedRoleProfile.'Role Profile ID'),

                                      Set(
                                          varSavedRoleProfile,
                                          Patch(
                                              BLC_RoleProfiles,
                                              varSavedRoleProfile,
                                              {
                                                  'Role Profile ID':
                                                      "BLC-RP-" &
                                                      Text(Today(), "yyyy") &
                                                      "-" &
                                                      Right(
                                                          "000000" & Text(varSavedRoleProfile.ID),
                                                          6
                                                      )
                                              }
                                          )
                                      )
                                  ),

                              "Entitlement",
                                  Set(
                                      varSavedEntitlement,
                                      Patch(
                                          BLC_Entitlements,
                                          If(
                                              varEditMode = "Edit",
                                              varSelectedEntitlement,
                                              Defaults(BLC_Entitlements)
                                          ),
                                          {
                                              Title: Trim(txtEntitlementTitle.Text),

                                              Description: If(
                                                  IsBlank(Trim(txtEntitlementDescription.Text)),
                                                  Blank(),
                                                  Trim(txtEntitlementDescription.Text)
                                              ),

                                              'Entitlement Category': {
                                                  Value: drpEntitlementCategory.Selected.Value
                                              },

                                              SystemReference: If(
                                                  IsBlank(Trim(txtEntitlementSystem.Text)),
                                                  Blank(),
                                                  Trim(txtEntitlementSystem.Text)
                                              ),

                                              Active: tglEntitlementActive.Value,

                                              'Task Title Joiner': If(
                                                  IsBlank(Trim(txtTaskTitleJoiner.Text)),
                                                  Blank(),
                                                  Trim(txtTaskTitleJoiner.Text)
                                              ),

                                              'Task Description Joiner': If(
                                                  IsBlank(Trim(txtEntitlementDescriptionJoiner.Text)),
                                                  Blank(),
                                                  Trim(txtEntitlementDescriptionJoiner.Text)
                                              ),

                                              'Task Owner Joiner': {
                                                  Value: drpTaskOwnerGroupJoiner.Selected.Value
                                              },

                                              'Due Offset Days Joiner': If(
                                                  IsBlank(Trim(txtDueOffsetDaysJoiner.Text)),
                                                  Blank(),
                                                  Value(txtDueOffsetDaysJoiner.Text)
                                              ),

                                              'Requires Evidence Joiner': tglRequiresEvidenceJoiner.Value,

                                              'Evidence Description Joiner': If(
                                                  IsBlank(Trim(txtEvidenceDescriptionJoiner.Text)),
                                                  Blank(),
                                                  Trim(txtEvidenceDescriptionJoiner.Text)
                                              ),

                                              'Task Title Mover': If(
                                                  IsBlank(Trim(txtTaskTitleMover.Text)),
                                                  Blank(),
                                                  Trim(txtTaskTitleMover.Text)
                                              ),

                                              'Task Description Mover': If(
                                                  IsBlank(Trim(txtEntitlementDescriptionMover.Text)),
                                                  Blank(),
                                                  Trim(txtEntitlementDescriptionMover.Text)
                                              ),

                                              'Task Owner Mover': {
                                                  Value: drpTaskOwnerGroupMover.Selected.Value
                                              },

                                              'Due Offset Days Mover': If(
                                                  IsBlank(Trim(txtDueOffsetDaysMover.Text)),
                                                  Blank(),
                                                  Value(txtDueOffsetDaysMover.Text)
                                              ),

                                              'Requires Evidence Mover': tglRequiresEvidenceMover.Value,

                                              'Evidence Description Mover': If(
                                                  IsBlank(Trim(txtEvidenceDescriptionMover.Text)),
                                                  Blank(),
                                                  Trim(txtEvidenceDescriptionMover.Text)
                                              ),

                                              'Task Title Leaver': If(
                                                  IsBlank(Trim(txtTaskTitleLeaver.Text)),
                                                  Blank(),
                                                  Trim(txtTaskTitleLeaver.Text)
                                              ),

                                              'Task Description Leaver': If(
                                                  IsBlank(Trim(txtEntitlementDescriptionLeaver.Text)),
                                                  Blank(),
                                                  Trim(txtEntitlementDescriptionLeaver.Text)
                                              ),

                                              'Task Owner Leaver': {
                                                  Value: drpTaskOwnerGroupLeaver.Selected.Value
                                              },

                                              'Due Offset Days Leaver': If(
                                                  IsBlank(Trim(txtDueOffsetDaysLeaver.Text)),
                                                  Blank(),
                                                  Value(txtDueOffsetDaysLeaver.Text)
                                              ),

                                              'Requires Evidence Leaver': tglRequiresEvidenceLeaver.Value,

                                              'Evidence Description Leaver': If(
                                                  IsBlank(Trim(txtEvidenceDescriptionLeaver.Text)),
                                                  Blank(),
                                                  Trim(txtEvidenceDescriptionLeaver.Text)
                                              )
                                          }
                                      )
                                  );

                                  If(
                                      varEditMode = "New" ||
                                      IsBlank(varSavedEntitlement.'Entitlement ID'),

                                      Set(
                                          varSavedEntitlement,
                                          Patch(
                                              BLC_Entitlements,
                                              varSavedEntitlement,
                                              {
                                                  'Entitlement ID':
                                                      "BLC-ENT-" &
                                                      Text(Today(), "yyyy") &
                                                      "-" &
                                                      Right(
                                                          "000000" & Text(varSavedEntitlement.ID),
                                                          6
                                                      )
                                              }
                                          )
                                      )
                                  )
                          );

                          Notify(
                              Switch(
                                  varMasterDataMode,
                                  "RoleProfile", If(varEditMode = "Edit", "Rolle wurde aktualisiert.", "Rolle wurde gespeichert."),
                                  "Entitlement", If(varEditMode = "Edit", "Berechtigung wurde aktualisiert.", "Berechtigung wurde gespeichert."),
                                  "Eintrag wurde gespeichert."
                              ),
                              NotificationType.Success
                          );

                          Refresh(BLC_RoleProfiles);
                          Refresh(BLC_Entitlements);

                          If(
                              varMasterDataMode = "RoleProfile",
                              Set(
                                  varSelectedRole,
                                  LookUp(
                                      BLC_RoleProfiles,
                                      ID = varSavedRoleProfile.ID
                                  )
                              )
                          );

                          If(
                              varMasterDataMode = "Entitlement",
                              Set(
                                  varSelectedEntitlement,
                                  LookUp(
                                      BLC_Entitlements,
                                      ID = varSavedEntitlement.ID
                                  )
                              )
                          );

                          Navigate(
                              scrRoleEntitlementManager,
                              ScreenTransition.Fade
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =13
                        Text: |
                          =
                          Switch(
                              varMasterDataMode,
                              "RoleProfile", "Rolle speichern",
                              "Entitlement", "Berechtigung speichern",
                              "Speichern"
                          )
                        Width: =210
                  - btnBackMasterData:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(200,200,200,1)
                        BorderThickness: =1
                        Color: =RGBA(40,40,40,1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |-
                          =Switch(
                              varMasterDataMode,

                              "RoleProfile",
                                  If(
                                      IsBlank(Trim(txtRoleTitle.Text)),
                                      DisplayMode.Disabled,
                                      DisplayMode.Edit
                                  ),

                              "Entitlement",
                                  If(
                                      IsBlank(Trim(txtEntitlementTitle.Text)) ||
                                      IsBlank(Trim(txtEntitlementSystem.Text)) ||
                                      IsBlank(drpEntitlementCategory.Selected),
                                      DisplayMode.Disabled,
                                      DisplayMode.Edit
                                  ),

                              DisplayMode.Disabled
                          )
                        Fill: =RGBA(240,240,240,1)
                        Font: =Font.'Open Sans'
                        Height: =42
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Navigate(
                              scrRoleEntitlementManager,
                              ScreenTransition.Fade
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =13
                        Text: ="Zurück"
                        Width: =120
      - cntMasterHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0,120,212,1)
            Height: =70
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
