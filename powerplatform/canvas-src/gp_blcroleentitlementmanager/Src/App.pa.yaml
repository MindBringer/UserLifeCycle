App:
  Properties:
    OnStart: |-
      =Set(varSelectedRole, Blank());

      ClearCollect(
          colRoleEntitlements,
          []
      );

      ClearCollect(
          colCategories,

              {Label:"Alle",Value: "All"},
              {Label:"Microsoft 365", Value:"M365"},
              {Label:"Identität", Value:"Identity"},
              {Label:"Sicherheit", Value:"Security"},
              {Label:"Netzwerk", Value:"Network"},
              {Label:"Hardware", Value:"Hardware"},
              {Label:"Arbeitsplatz", Value:"Workplace"},
              {Label:"Telefonie", Value:"Telephony"},
              {Label:"Personal", Value:"HR"},
              {Label:"Anwendung", Value:"Application"},
              {Label:"Compliance", Value:"Compliance"},
              {Label:"Sonstiges", Value:"Other"}
      )
    StartScreen: =scrHome
    Theme: =PowerAppsTheme
