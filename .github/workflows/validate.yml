name: Validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository audit
        run: python3 tools/companion/audit_repo.py
      - name: Compile declarative schema
        run: python3 tools/schema/generator.py
      - name: Lifecycle engine self test
        run: python3 tools/lifecycle/selftest.py
      - name: Validate provisioning JSON
        shell: pwsh
        run: |
          Get-Content Provisioning/reset-policy.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content schema/seed/manifest.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content engine/engine-config.json -Raw | ConvertFrom-Json | Out-Null
      - name: Parse provisioning PowerShell
        shell: pwsh
        run: |
          $errors = [System.Collections.Generic.List[object]]::new()
          Get-ChildItem Provisioning -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in @($parseErrors)) { $errors.Add($parseError) }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Validate Power Platform source
        shell: pwsh
        run: ./powerplatform/scripts/Validate-Solution.ps1
      - name: Parse workflow JSON
        shell: pwsh
        run: |
          Get-ChildItem powerplatform/src/BenutzerLifeCycle/Workflows -Filter *.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
      - name: Parse solution XML
        shell: pwsh
        run: |
          [xml](Get-Content powerplatform/src/BenutzerLifeCycle/Other/Solution.xml -Raw) | Out-Null
          [xml](Get-Content powerplatform/src/BenutzerLifeCycle/Other/Customizations.xml -Raw) | Out-Null
