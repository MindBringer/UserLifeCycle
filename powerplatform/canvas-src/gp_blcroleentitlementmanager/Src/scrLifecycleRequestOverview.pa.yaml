                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Items: |
                                =
                                Table(
                                    {Label: "Alle", Value: "Alle"},
                                    {Label: "Eintritt", Value: "Onboarding"},
                                    {Label: "Wechsel", Value: "Mover"},
                                    {Label: "Austritt", Value: "Offboarding"}
                                )
                              Items.Value: =Label
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Width: =180
                        - icoRefresh:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(0, 18, 107, 1)
                              Icon: =Icon.Reload
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |
                                =
                                Refresh(BLC_LifecycleRequests);
                                Refresh(BLC_LifecycleTasks)
                              Width: =32
                        - btnNewRequest:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =RGBA(0,120,212,1)
                              Font: =Font.'Open Sans'
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |
                                =
                                Navigate(
                                    scrRequestNew,
                                    ScreenTransition.Fade
                                )
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              Text: ="+ Neuer Vorgang"
                              Width: =180
                        - chkShowCompleted:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              CheckboxBorderColor: =RGBA(0, 18, 107, 1)
                              CheckmarkFill: =RGBA(0, 0, 0, 1)
                              Font: =Font.'Open Sans'
                              HoverColor: =RGBA(0, 18, 107, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: ="alle Vorgänge"
                  - galRequests:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =Parent.Height - 60
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  BLC_LifecycleRequests,

                                  (
                                      chkShowCompleted.Value
                                      ||
                                      (
                                          'Lifecycle Status'.Value <> "Completed" &&
                                          'Lifecycle Status'.Value <> "Cancelled" &&
                                          'Lifecycle Status'.Value <> "Archived"
                                      )
                                  )
                                  &&

                                  (
                                      drpRequestType.Selected.Value = "Alle"
                                      ||
                                      'Request Type'.Value = drpRequestType.Selected.Value
                                  )
                              ),
                              "Created",
                              SortOrder.Descending
                          )
                        TemplateFill: |
                          =
                          If(
                              ThisItem.ID = galRequests.Selected.ID,
                              RGBA(100,190,250,1),
                              Switch(
                                  ThisItem.'Lifecycle Status'.Value,
                                  "Completed", RGBA(232,245,233,1),
                                  "InProgress", RGBA(225,239,255,1),
                                  "Submitted", RGBA(255,244,224,1),
                                  "Approved", RGBA(225,239,255,1),
                                  "WaitingForInput", RGBA(255,235,235,1),
                                  "Cancelled", RGBA(242,242,242,1),
                                  RGBA(250,250,250,1)
                              )
                          )
                        Width: =Parent.Width
                      Children:
                        - rectSeparatorRequests:
                            Control: Rectangle@2.3.0
                            Properties:
