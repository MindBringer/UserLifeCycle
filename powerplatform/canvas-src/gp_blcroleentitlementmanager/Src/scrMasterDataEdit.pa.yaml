                            Children:
                              - lblNewEvidenceDescriptionLeaver:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(90,90,90,1)
                                    Font: =Font.'Open Sans'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =12
                                    Text: ="Nachweis-Hinweis:"
                                    Width: =180
                              - txtEvidenceDescriptionLeaver:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: |-
                                      =If(
                                          varEditMode = "Edit",
                                          varSelectedEntitlement.'Evidence Description Leaver',
                                          ""
                                      )
                                    Font: =Font.'Open Sans'
                                    Height: =80
                                    HintText: ="z. B. Screenshot, Ticketnummer oder Link zum Systemnachweis erfassen"
                                    HoverBorderColor: =RGBA(0, 18, 107, 1)
                                    HoverFill: =RGBA(186, 202, 226, 1)
                                    LayoutMinHeight: =80
                                    LayoutMinWidth: =16
