                              - lblNewDueLeaver:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(90,90,90,1)
                                    Font: =Font.'Open Sans'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =12
                                    Text: ="Fälligkeit (Tage):"
                                    Width: =180
                              - txtDueOffsetDaysLeaver:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: |-
                                      =If(
