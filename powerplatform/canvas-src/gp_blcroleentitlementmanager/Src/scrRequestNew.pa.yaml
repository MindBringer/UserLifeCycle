                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: "=Switch(\n    drpRequestTypeNew.Selected.Value,\n\n    \"Onboarding\",\n        Set(\n            varManagerMail,\n            Lower(\n                Coalesce(\n                    cmbManager.Selected.Mail,\n                    cmbManager.Selected.UserPrincipalName\n                )\n            )\n        );\n\n        Set(\n            varCreatedRequest,\n            Patch(\n                BLC_LifecycleRequests,\n                Defaults(BLC_LifecycleRequests),\n                {\n                    Titel: Trim(txtDisplayName.Text),\n                    'Request Type': {Value: \"Onboarding\"},\n                    FirstName:Trim(txtFirstName.Text),\n                    LastName:Trim(txtLastName.Text),\n                    'Target Display Name': Trim(txtDisplayName.Text),\n                    'Target UPN': Lower(Trim(txtUPN.Text)),\n                    'Requested Email': Lower(Trim(txtEmail.Text)),\n                    Department: Trim(txtDepartment.Text),\n\n                    Manager: {\n                        Claims: \"i:0#.f|membership|\" & varManagerMail,\n                        DisplayName: cmbManager.Selected.DisplayName,\n                        Email: varManagerMail,\n                        Department: \"\",\n                        JobTitle: \"\",\n                        Picture: \"\"\n                    },\n\n                    'Requested By': {\n                        Claims: \"i:0#.f|membership|\" & Lower(User().Email),\n                        DisplayName: User().FullName,\n                        Email: Lower(User().Email),\n                        Department: \"\",\n                        JobTitle: \"\",\n                        Picture: \"\"\n                    },\n\n                    'Start Date': dpStartDate.SelectedDate,\n                    'Lifecycle Status': {Value: \"Submitted\"},\n                    Priority: {Value: \"Normal\"},\n                    'Employee Created': false,\n                    'Tasks Created': false,\n\n                    'Role Profile': {\n                        Id: cmbRoleProfile.Selected.ID,\n                        Value: cmbRoleProfile.Selected.Title\n                    },\n\n                    Comments: If(\n                        IsBlank(Trim(txtComments.Text)),\n                        Blank(),\n                        Trim(txtComments.Text)\n                    )\n                }\n            )\n        ),\n\n    \"Mover\",\n        Set(\n            varCreatedRequest,\n            Patch(\n                BLC_LifecycleRequests,\n                Defaults(BLC_LifecycleRequests),\n                {\n                    Titel: cmbEmployee.Selected.'Display Name' & \" - Wechsel\",\n                    'Request Type': {Value: \"Mover\"},\n                    'Target Display Name': cmbEmployee.Selected.'Display Name',\n                    'Target UPN': cmbEmployee.Selected.UPN,\n                    'Requested Email': cmbEmployee.Selected.Email,\n\n                    'Lifecycle Status': {Value: \"Submitted\"},\n                    Priority: {Value: \"Normal\"},\n                    'Requested By': {\n                        Claims: \"i:0#.f|membership|\" & Lower(User().Email),\n                        DisplayName: User().FullName,\n                        Email: Lower(User().Email),\n                        Department: \"\",\n                        JobTitle: \"\",\n                        Picture: \"\"\n                    },\n\n                    'Effective Date': dpEffectiveDate.SelectedDate,\n                    'Employee Created': true,\n                    'Tasks Created': false,\n\n                    'Related Employee': {\n                        Id: cmbEmployee.Selected.ID,\n                        Value: cmbEmployee.Selected.'Display Name'\n                    },\n\n                    'Role Profile': {\n                        Id: cmbNewRoleProfile.Selected.ID,\n                        Value: cmbNewRoleProfile.Selected.Title\n                    },\n\n                    'Requested Display Name': If(\n                        IsBlank(Trim(txtRequestedDisplayName.Text)),\n                        Blank(),\n                        Trim(txtRequestedDisplayName.Text)\n                    ),\n\n                    'Requested UPN': If(\n                        IsBlank(Trim(txtRequestedUPN.Text)),\n                        Blank(),\n                        Lower(Trim(txtRequestedUPN.Text))\n                    ),\n\n                    'Requested Phone Number': If(\n                        IsBlank(Trim(txtRequestedPhoneNumber.Text)),\n                        Blank(),\n                        Trim(txtRequestedPhoneNumber.Text)\n                    ),\n\n                    Comments: If(\n                        IsBlank(Trim(txtComments.Text)),\n                        Blank(),\n                        Trim(txtComments.Text)\n                    )\n                }\n            )\n        ),\n    \n    \"Offboarding\",\n    Set(\n        varCreatedRequest,\n        Patch(\n            BLC_LifecycleRequests,\n            Defaults(BLC_LifecycleRequests),\n            {\n                Titel: cmbLeaverEmployee.Selected.'Display Name' & \" - Austritt\",\n\n                'Request Type': {Value: \"Offboarding\"},\n                'Target Display Name': cmbLeaverEmployee.Selected.'Display Name',\n                'Target UPN': cmbLeaverEmployee.Selected.UPN,\n                'Requested Email': cmbLeaverEmployee.Selected.Email,\n\n                'Lifecycle Status': {Value: \"Submitted\"},\n                Priority: {Value: \"Normal\"},\n\n                'Requested By': {\n                    Claims: \"i:0#.f|membership|\" & Lower(User().Email),\n                    DisplayName: User().FullName,\n                    Email: Lower(User().Email),\n                    Department: \"\",\n                    JobTitle: \"\",\n                    Picture: \"\"\n                },\n\n                'End Date': dpEndDate.SelectedDate,\n                'Employee Created': true,\n                'Tasks Created': false,\n\n                'Related Employee': {\n                    Id: cmbLeaverEmployee.Selected.ID,\n                    Value: cmbLeaverEmployee.Selected.'Display Name'\n                },\n\n                Comments: If(\n                    IsBlank(Trim(txtComments.Text)),\n                    Blank(),\n                    Trim(txtComments.Text)\n                )\n            }\n        )\n    )\n);\n\nNotify(\n    Switch(\n        drpRequestTypeNew.Selected.Value,\n        \"Onboarding\", \"Eintritt wurde erstellt. Lifecycle ID wird automatisch vergeben.\",\n        \"Mover\", \"Wechsel wurde erstellt. Lifecycle ID wird automatisch vergeben.\",\n        \"Offboarding\", \"Austritt wurde erstellt. Lifecycle ID wird automatisch vergeben.\",\n        \"Vorgang wurde erstellt.\"\n    ),\n    NotificationType.Success\n);\n\nRefresh(BLC_LifecycleRequests);\n\nNavigate(\n    scrLifecycleRequestOverview,\n    ScreenTransition.Fade\n)"
                        PressedBorderColor: =Self.Fill
