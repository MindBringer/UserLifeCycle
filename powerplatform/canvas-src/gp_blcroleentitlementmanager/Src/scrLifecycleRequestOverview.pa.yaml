                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(35,35,35,1)
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: =ThisItem.'Lifecycle ID'
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 86
                              X: =16
                              Y: =(Parent.TemplateHeight - (Self.Size*1.8 + lblRequestSubtitle.Size*1.8 + 2 + lblRequestMeta.Size*1.8)) / 2
                        - lblRequestSubtitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(45,45,45,1)
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =ThisItem.'Target Display Name'
                              VerticalAlign: =VerticalAlign.Top
                              Width: =lblRequestTitle.Width
                              X: =lblRequestTitle.X
                              Y: =lblRequestTitle.Y + lblRequestTitle.Height
                        - lblRequestMeta:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(80,80,80,1)
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =Switch(
                                    ThisItem.'Request Type'.Value,
                                    "Onboarding", "Eintritt",
                                    "Mover", "Wechsel",
                                    "Offboarding", "Austritt",
                                    "AccessRequest", "Berechtigungsanfrage",
                                    ThisItem.'Request Type'.Value
                                )
                                &
                                " | "
                                &
                                Switch(
                                    ThisItem.'Lifecycle Status'.Value,
                                    "Submitted", "eingereicht",
                                    "Approved", "freigegeben",
                                    "InProgress", "in Bearbeitung",
                                    "Completed", "abgeschlossen",
                                    "WaitingForInput", "Rückfrage",
                                    "Maintenance", "Wartung",
                                    "Cancelled", "abgebrochen",
                                    ThisItem.'Lifecycle Status'.Value
